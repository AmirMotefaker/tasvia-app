name: Security and quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: CI_ONLY_PLACEHOLDER
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:CI_ONLY_PLACEHOLDER@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:CI_ONLY_PLACEHOLDER@127.0.0.1:5432/ci
      BETTER_AUTH_SECRET: CI_ONLY_BETTER_AUTH_SECRET_32_CHARS_MINIMUM_NOT_FOR_RUNTIME

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan tracked source for secrets
        run: npm run security:secrets

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Rehearse migrations on ephemeral PostgreSQL and verify zero drift
        run: npm run db:rehearsal

      - name: Verify recovery grant atomic consumption on PostgreSQL
        run: npm run db:rehearsal:recovery-concurrency

      - name: Verify recovery challenge atomic verification on PostgreSQL
        run: npm run db:rehearsal:recovery-challenge-concurrency

      - name: Verify challenge-to-grant transaction on PostgreSQL
        run: npm run db:rehearsal:recovery-transaction

      - name: Create isolated populated legacy rehearsal database
        run: docker exec ${{ job.services.postgres.id }} createdb -U ci legacy_ci

      - name: Rehearse migration against populated legacy database
        env:
          LEGACY_REHEARSAL_DATABASE_URL: postgresql://ci:CI_ONLY_PLACEHOLDER@127.0.0.1:5432/legacy_ci
        run: npm run db:rehearsal:legacy

      - name: Verify production readiness defaults fail closed
        shell: bash
        run: |
          set +e
          output="$(npm run production:readiness 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 2
          printf '%s' "$output" | grep '"status": "BLOCKED"'
          printf '%s' "$output" | grep 'backup-not-verified'
          printf '%s' "$output" | grep 'legacy-inventory-incomplete'

      - name: Verify readiness logic with synthetic non-production evidence
        env:
          TASVIN_BACKUP_VERIFIED: "true"
          TASVIN_RESTORE_REHEARSED: "true"
          TASVIN_MIGRATION_REHEARSAL_PASSED: "true"
          TASVIN_ROLLBACK_PLAN_VERIFIED: "true"
          TASVIN_LEGACY_INVENTORY_COMPLETE: "true"
        run: npm run production:readiness

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
