name: Security and quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:CI_ONLY_PLACEHOLDER@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:CI_ONLY_PLACEHOLDER@127.0.0.1:5432/ci
      BETTER_AUTH_SECRET: CI_ONLY_BETTER_AUTH_SECRET_32_CHARS_MINIMUM_NOT_FOR_RUNTIME

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan tracked source for secrets
        run: npm run security:secrets

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
